<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }

    header{
        height: 100px;
        width: 100%;
        background-color: blue;
        text-align: center; text-decoration-color: white;
    }

    nav{
        height: 100px;
        width: 100%;
        background-color: olive;
         text-align: center; text-decoration-color: white;
    }
    

    main{
        height: 500px;
        width: 100%;
        background-color: cyan;
    }
    .sec1{
        height: 300px;
        width: 50%;
        background-color: coral;
        border: 2px solid;
        float: left;
        text-decoration: underline; text-align: center;
    }
     aside{
        height: 100%;
        width: 100%;
        background-color: darkgreen;
        text-align: center;
    }
    .sec2{
        height: 300px;
        width: 50%;
        background-color: brown;
        border: 2px solid;
        float: right;
        text-align: center; text-decoration: underline; 
    }

    footer{
        height: 100px;
        width: 100%;
        background-color: rgb(41, 24, 3);
        text-align: center;
    
    }
    </style>
</head>
<body>
    <div class="con">
        <header> Header </header>

        <nav>Nav</nav>

        <main>

            <section class="sec1">Section 1</section>
        <section class="sec2">Section 2</section>
         <aside>Aside</aside> 
            
        </main>

        <footer> Footer </footer>
    </div>
</body>
</html>
