<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<STYle>
    *{
        padding: 0%;
        margin: 0%;
        box-sizing: border-box;
    }
    header{
        width: 100%;
        height: 100px;
        background-color: red;
        text-decoration: rgb(255, 255, 255);
        text-align: center;
        font-size: larger;
        color: white;
    }
    main{
        width: 100%;
        height: 500px;
        background-color: blue;
    }
    .sec1{
        width: 33%;
        height: 500px;
        background-color: brown;
        float: left;
        border: 2px solid;
        text-align: center;
        text-decoration: underline;
        border-image: fill;

    }
    .sec2{
        width: 33%;
        height: 500px;
        background-color: aqua;
        float: left;
        border: 2px solid;
        text-align: center;
        text-decoration: underline;
    }
    .sec3{
        width: 34%;
        height: 500px;
        background-color: chocolate;
        float: right;
        border: 2px solid;
        text-align: center;
        text-decoration: underline;
    }

    footer{
        width: auto;
        height: 100px;
        background-color: blueviolet;
        text-align: center;
        text-decoration: underline;
        color: white;
    }
</STYle>
<body>
<div class="can">
    <Header> <h1>Welcome</h1>  </Header>

    <main>
    <section class="sec1" > <img src="/LADY ON GLASSES 1.jpg" alt="">SECTION 1 </section>
    <section class="sec2"> SECTION 2 </section>
    <section class="sec3"> SECTION 3 </section>
    </main>
    
    <footer> FOOTER </footer>
</div>    
</body>
</html>
